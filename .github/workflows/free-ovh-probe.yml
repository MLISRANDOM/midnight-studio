name: Free OVH Image Provider Probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "factory/ovh_probe.py"
      - ".github/workflows/free-ovh-probe.yml"
permissions:
  contents: read
jobs:
  single-free-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image validation
        run: python -m pip install "Pillow>=10,<13"
      - name: Submit ONE anonymous free OVH SDXL image request
        run: python factory/ovh_probe.py
      - name: Save image or diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-ovh-image-probe
          path: factory-output/ovh-probe/
          if-no-files-found: error
          retention-days: 7
