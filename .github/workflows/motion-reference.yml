name: Analyze an authorized YouTube reference
on:
  workflow_dispatch:
    inputs:
      video:
        description: Public YouTube video link, up to 20 minutes
        required: true
        type: string
      authorized:
        description: I own this video or have permission to process it
        required: true
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths: ["motion/youtube_job.py", "motion/youtube-requirements.txt", ".github/workflows/motion-reference.yml"]
permissions:
  contents: read
jobs:
  measure:
    if: (github.event_name == 'pull_request' || inputs.authorized) && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install decoding tools
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get -o Acquire::Retries=2 update -qq
            sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends ffmpeg
          fi
          python -m pip install --require-hashes -r motion/youtube-requirements.txt
      - name: Measure entire reference and create return link
        env:
          SOURCE_VIDEO: ${{ github.event_name == 'pull_request' && 'https://www.youtube.com/watch?v=YE7VzlLtp-4' || inputs.video }}
        run: python motion/youtube_job.py "$SOURCE_VIDEO" --authorized --output "$RUNNER_TEMP/technique.json"
      - uses: actions/upload-artifact@v4
        with:
          name: reference-measurements
          path: ${{ runner.temp }}/technique.json
          retention-days: 1
