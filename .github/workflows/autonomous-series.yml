name: Autonomous Episode Draft Series
on:
  schedule:
    - cron: '43 9 * * *'
  push:
    branches: [main]
    paths:
      - "factory/series_plan.json"
      - "factory/series_runner.py"
      - ".github/workflows/autonomous-series.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: midnight-autonomous-series
  cancel-in-progress: false
jobs:
  draft-series:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      PIPER_MODEL: ${{ github.workspace }}/factory/voices/en_US-ryan-medium.onnx
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore saved episode outputs
        uses: actions/cache@v4
        with:
          path: factory-output/autonomous-series
          key: autonomous-series-${{ hashFiles('factory/series_plan.json') }}-${{ github.run_id }}
          restore-keys: |
            autonomous-series-${{ hashFiles('factory/series_plan.json') }}-
      - name: Install free video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install "Pillow>=10,<13"
      - name: Prepare optional free local neural narration
        run: |
          python -m pip install "piper-tts>=1,<2" || echo "Piper unavailable, eSpeak fallback enabled"
          mkdir -p factory/voices
          BASE="https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ryan/medium"
          curl --fail --location --retry 2 --max-time 120 "$BASE/en_US-ryan-medium.onnx" -o factory/voices/en_US-ryan-medium.onnx || rm -f factory/voices/en_US-ryan-medium.onnx
          curl --fail --location --retry 2 --max-time 60 "$BASE/en_US-ryan-medium.onnx.json" -o factory/voices/en_US-ryan-medium.onnx.json || rm -f factory/voices/en_US-ryan-medium.onnx.json
      - name: Check syntax and offline render
        run: |
          python -m py_compile factory/episode_factory.py factory/series_runner.py factory/selftest.py factory/series_selftest.py
          python factory/selftest.py
          python factory/series_selftest.py
      - name: Advance one unfinished draft episode
        env:
          AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
          FACTORY_NEW_SHOTS_PER_RUN: '2'
        run: |
          python factory/series_runner.py --series factory/series_plan.json --output factory-output/autonomous-series
      - name: Upload all reports, still images and finished draft MP4s
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-series-drafts
          path: factory-output/autonomous-series/
          if-no-files-found: warn
          retention-days: 30
