name: Motion Lab iPhone WebKit verification
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "motion/*.mjs"
      - "motion/*.html"
      - "motion/tests/mobile*"
      - "motion/tests/DeviceCheck.m"
      - "motion/tools/prepare_runtime.py"
      - ".github/workflows/motion-device-test.yml"
permissions:
  contents: read
jobs:
  mobile-safari:
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Exercise the production page in an iPhone simulator WebKit host
        run: python3 motion/tests/mobile_runner.py --engine ios-webkit --public-model --runtime "$RUNNER_TEMP/runtime" --out "$RUNNER_TEMP/motion-result"
      - name: Record decoded dimensions and real model timings
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/motion-result/result.json" ]; then
            echo '## iPhone WebKit result' >> "$GITHUB_STEP_SUMMARY"
            echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/motion-result/result.json" >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          fi
