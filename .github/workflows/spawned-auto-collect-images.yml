name: Auto-collect Higgsfield candidates

on:
  push:
    paths:
      - spawned-somewhere-bad/episode01/transfer-queue.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image verifier
        run: python -m pip install 'Pillow>=10,<13'
      - name: Download and validate each queued image
        run: |
          python - <<'PY'
          import io,json,pathlib,re,urllib.parse,urllib.request
          from PIL import Image
          path = pathlib.Path("spawned-somewhere-bad/episode01/transfer-queue.json")
          entries = json.loads(path.read_text())["images"]
          assert isinstance(entries,list) and 1<=len(entries)<=24
          dest = pathlib.Path("candidates"); dest.mkdir(exist_ok=True)
          results = []
          for item in entries:
              shot=str(item["shot"]).strip().upper()
              assert re.fullmatch(r"S(?:00[1-9]|0[1-9][0-9]|1[0-9][0-9]|2[01][0-9]|22[0-8])", shot), "Bad shot label"
              url=str(item["url"]).strip()
              u=urllib.parse.urlsplit(url)
              assert u.scheme=="https" and u.hostname=="d8j0ntlcm91z4.cloudfront.net" and not u.username and not u.password and not u.port
              req=urllib.request.Request(url,headers={"User-Agent":"SpawnedCandidateCollector/1.0"})
              with urllib.request.urlopen(req,timeout=45) as response:
                  data=response.read(25*1024*1024+1)
              assert 0<len(data)<=25*1024*1024
              with Image.open(io.BytesIO(data)) as im:
                  im.load()
                  w,h=im.size
                  assert w>=900 and h>=500 and abs(w/h-16/9)<0.12
                  im.convert("RGB").save(dest/f"{shot}.png",format="PNG")
              results.append({"shot":shot,"width":w,"height":h,"status":"candidate_unreviewed"})
              print("Saved",shot,w,h)
          (dest/"MANIFEST.json").write_text(json.dumps({"images":results},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: spawned-episode01-image-candidates
          path: candidates/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
