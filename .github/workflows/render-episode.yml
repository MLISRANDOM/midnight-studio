name: Render Safe Room Episode

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "render/episode.json"

permissions:
  contents: read

jobs:
  render-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install "Pillow>=10,<13"

      - name: Assemble MP4
        run: python render/render_episode.py --manifest render/episode.json --output rendered/safe-room-episode.mp4

      - name: Upload downloadable episode
        uses: actions/upload-artifact@v4
        with:
          name: safe-room-episode-mp4
          path: rendered/safe-room-episode.mp4
          if-no-files-found: error
          retention-days: 7
