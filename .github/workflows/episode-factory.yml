name: Episode Factory (resumable free drafts)
on:
  pull_request:
    paths:
      - "factory/**"
      - ".github/workflows/episode-factory.yml"
  workflow_dispatch:
    inputs:
      manifest:
        description: "Repository-local manifest JSON (factory/...)"
        required: true
        default: "factory/demo_episode.json"
        type: string
permissions:
  contents: read
concurrency:
  group: midnight-episode-factory
  cancel-in-progress: false
jobs:
  draft-episode:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      PIPER_MODEL: ${{ github.workspace }}/factory/voices/en_US-ryan-medium.onnx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resume last cached draft for this manifest
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: factory-output
          key: episode-factory-${{ hashFiles('factory/demo_episode.json') }}-${{ github.run_id }}
          restore-keys: |
            episode-factory-${{ hashFiles('factory/demo_episode.json') }}-
      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install "Pillow>=10,<13"
      - name: Prepare optional free local neural narration
        run: |
          python -m pip install "piper-tts>=1,<2" || echo "Piper unavailable, eSpeak fallback enabled"
          mkdir -p factory/voices
          BASE="https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ryan/medium"
          curl --fail --location --retry 2 --max-time 120 "$BASE/en_US-ryan-medium.onnx" -o factory/voices/en_US-ryan-medium.onnx || rm -f factory/voices/en_US-ryan-medium.onnx
          curl --fail --location --retry 2 --max-time 60 "$BASE/en_US-ryan-medium.onnx.json" -o factory/voices/en_US-ryan-medium.onnx.json || rm -f factory/voices/en_US-ryan-medium.onnx.json
      - name: Validate factory syntax and offline video rendering
        run: |
          python -m py_compile factory/episode_factory.py factory/selftest.py
          python factory/longform_selftest.py
          python factory/provider_selftest.py
          python factory/selftest.py
      - name: Build draft episode from manifest
        if: github.event_name != 'pull_request'
        env:
          AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
          MANIFEST: ${{ inputs.manifest || 'factory/demo_episode.json' }}
          FACTORY_NEW_SHOTS_PER_RUN: '2'
        run: |
          case "$MANIFEST" in
            factory/*.json) ;;
            *) echo "Manifest must live under factory/ and end in .json"; exit 1;;
          esac
          python factory/episode_factory.py --manifest "$MANIFEST" --output factory-output
      - name: Upload draft images, report, and video even on failure
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: episode-factory-draft
          path: factory-output/
          if-no-files-found: warn
          retention-days: 7
